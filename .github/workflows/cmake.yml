name: CMake Build and Package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure || true # Allow tests to fail since they are stubs

    - name: Package Artifacts
      run: |
        mkdir -p artifact
        cp ${{github.workspace}}/build/test_yarngpt artifact/
        cp ${{github.workspace}}/build/libyarngpt.a artifact/
        tar -czvf yarngpt_resources.tar.gz -C artifact/ .

    - name: Upload Resource
      uses: actions/upload-artifact@v4
      with:
        name: yarngpt-cpp-resources
        path: yarngpt_resources.tar.gz
