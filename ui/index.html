<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YarnGPT Streaming TTS</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; max-width: 800px; margin: 0 auto; padding: 2rem; background: #f9fafb; }
        .container { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        h1 { color: #111827; }
        textarea { width: 100%; height: 100px; margin-bottom: 1rem; padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 4px; }
        select, input { margin-bottom: 1rem; padding: 0.5rem; }
        button { background: #3b82f6; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #2563eb; }
        button:disabled { background: #9ca3af; cursor: not-allowed; }
        #status { margin-top: 1rem; color: #4b5563; }
    </style>
</head>
<body>
    <div class="container">
        <h1>YarnGPT Web Interface</h1>
        <p>Type text below and click Generate to hear the Nigerian-Accented TTS model stream the audio.</p>

        <textarea id="text" placeholder="Enter text to synthesize..."></textarea>

        <div>
            <label for="speaker">Speaker:</label>
            <select id="speaker">
                <option value="idera">Idera (Female)</option>
                <option value="jude">Jude (Male)</option>
                <option value="joke">Joke (Female)</option>
                <option value="umar">Umar (Male)</option>
            </select>
        </div>

        <button id="generateBtn">Generate Audio</button>
        <p id="status"></p>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });

        document.getElementById('generateBtn').addEventListener('click', async () => {
            const text = document.getElementById('text').value;
            const speaker = document.getElementById('speaker').value;
            const statusEl = document.getElementById('status');
            const btn = document.getElementById('generateBtn');

            if (!text) return;

            btn.disabled = true;
            statusEl.textContent = 'Connecting to server...';

            try {
                // We use fetch to stream the octet-stream back
                const response = await fetch('/v1/audio/speech', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, speaker, temperature: 0.1 })
                });

                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);

                statusEl.textContent = 'Streaming audio...';

                const reader = response.body.getReader();
                let nextStartTime = audioCtx.currentTime;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    // value is a Uint8Array of little-endian float32
                    const float32Array = new Float32Array(value.buffer, value.byteOffset, value.byteLength / 4);

                    const audioBuffer = audioCtx.createBuffer(1, float32Array.length, 24000);
                    audioBuffer.getChannelData(0).set(float32Array);

                    const source = audioCtx.createBufferSource();
                    source.buffer = audioBuffer;
                    source.connect(audioCtx.destination);

                    source.start(nextStartTime);
                    nextStartTime += audioBuffer.duration;
                }

                statusEl.textContent = 'Finished playing.';
            } catch (err) {
                console.error(err);
                statusEl.textContent = 'Error: ' + err.message;
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
